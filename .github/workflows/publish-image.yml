name: Publish image

# Builds and pushes str's image to GHCR with the repository's own GITHUB_TOKEN,
# the same mechanism as plow-pbc/meetly-openclaw-agent. Publishing is
# automatic; promoting a digest to Plow's one-click deploy stays a manual,
# admin-gated step (see the run summary).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: str-hermes-agent
  PLOW_SLUG: str

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}
          flavor: latest=false
          tags: type=sha

      # Plow runs linux/amd64 only.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="ghcr.io/${OWNER,,}/${PACKAGE_NAME}@${DIGEST}"
          {
            echo "## Published image"
            echo
            echo "\`${ref}\`"
            echo
            echo "## Promote to Plow (admin)"
            echo
            echo "\`plow-agents image promote ${PLOW_SLUG} ${ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"
