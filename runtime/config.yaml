# The declarative half of ~/.hermes — everything that is a deliberate choice for
# this deployment. Keys equal to the image's own defaults are deliberately
# absent so the image supplies its own current defaults instead of a frozen
# snapshot; likewise _config_version. (The image is pinned by digest in the
# Dockerfile — "current" means whatever that pinned image ships, not `latest`.) Verified against the running image: with
# the key absent, hermes config get _config_version reports the current 33 and
# the file is left byte-identical — an unversioned config is read as current,
# not as an old schema needing migration.
#
# Deliberately inherited, not pinned: the image's local terminal and browser
# backends stay enabled. The agent is used for real operations work and needs
# them; because the container mounts ~/.hermes, that is also the deployment's
# widest blast radius. See the trust boundary in the README before adding a
# group chat.
# What plow-init writes on every boot from the base image's seed, restated here
# so a restore and a boot agree. Plow's proxy fronts Anthropic; the id must be
# one the proxy serves.
model:
  default: anthropic/claude-sonnet-5
  provider: plow
  base_url: "${PLOW_API_BASE}/v1"
  key_env: HERMES_CUSTOM_PLOW_API_KEY
providers:
  plow:
    name: plow
    base_url: "${PLOW_API_BASE}/v1"
    key_env: HERMES_CUSTOM_PLOW_API_KEY
    stale_timeout_seconds: 55
    models:
      anthropic/claude-sonnet-5: {}
agent:
  # Carried over from the original install rather than re-derived; kept so a
  # restore reproduces the behaviour the operator has been running with.
  verify_on_stop: false
cron:
  # The approval rules in bin/hostex-poll.py's prompt are written against a
  # draft the answering turn can see. It cannot: a cron delivery runs in its own
  # session, which ends before the owner replies, so the reply arrives in the
  # group's session with no draft in it. Mirroring appends the delivered text
  # there, which is the antecedent those rules already name.
  #
  # Scoped by the image to the job's origin conversation, so it changes nothing
  # for a job without one — every other job here is CLI-created with origin
  # null. enable-hostex-inbound.sh stamps the origin that opts this one in.
  mirror_delivery: true
# The other half of that mirror: one session per group chat, not one per member.
# The image resolves a delivery's session by chat id, and refuses to pick when
# the chat has several open sessions belonging to different people rather than
# guess whose to write into. Per-member sessions therefore make mirror_delivery
# above a silent no-op in exactly the group it exists for — the delivery still
# succeeds and the skip logs at debug, so the job reports ok while the draft
# never lands (#84). Stamping a user id on the job would resolve one member's
# session and stand the other owner in front of the same missing draft.
#
# Gateway-level on purpose: this is the key the *persisted* session is written
# under, and the image reads it only from the top level of this file or a
# `gateway:` section — never from a platform's `extra`. The plow_chat plugin
# sets the same value in its adapter config; that one governs the in-memory
# dispatch guard, and the two have to agree. See the comment there.
#
# The cost is that the owners share conversation context in a group thread,
# which is what a group thread reads like anyway.
group_sessions_per_user: false
plugins:
  enabled:
  - plow-chat-platform
  entries:
    plow-chat-platform:
      allow_tool_override: false
platforms:
  plow_chat:
    enabled: true
    extra:
      # What each group is *for*, appended to the stay-quiet-unless-addressed
      # policy rather than replacing it. Keyed by the display name from
      # PLOW_CHAT_GROUP_UIDS, not by chat uid: this file must match no cht_ id
      # (tests/test_runtime_config.py), and uids are per-account anyway, so a
      # restore onto a fresh host would carry bindings that no longer exist.
      # A key naming no configured group is logged and skipped, not fatal: on a
      # fresh restore the dotenv half is still blank, and refusing to start
      # there would break the recovery this file exists for.
      group_prompts:
        STR Owners: |
          The owners' thread for the short-term rentals — the people who own
          the properties. Operational candor is fine here: costs, maintenance
          problems, guest complaints, and money are all in scope. This is where
          decisions about the properties get made, so it is the right place to
          raise something that needs an owner's judgement.

          Guest-reply drafts are delivered here, by a scheduled job, each
          carrying a short draft id. Most arrive for approval; one that passed
          the SOUL.md veto-window test (SOUL.md owns that rule — apply it as
          written there) instead arrives announced as "sending in 30 minutes
          unless an owner says stop", with the vault bullets it relied on
          quoted beside it and a one-shot send job already scheduled. Any owner reply naming that
          draft id — "stop", an edit, even a question — cancels the pending
          job: delete it, say so, and treat an edit as a fresh draft on the
          approval path. Each delivery is mirrored into this thread, so the
          draft an owner is answering is above you — read it there.

          In this thread, a reply directed at you approving, editing, or
          declining a draft is still directed at you however brief it is —
          "yes", "send it", "no". Brevity is not a reason to stay silent.
          Owners talking to each other is not: "just tell her checkout is 11"
          said to the other owner is a conversation between them, not wording
          handed to you. When you cannot tell which it is, ask.

          Never replace an approved draft with your own re-composition — the
          owner approved particular words, and sending different ones defeats
          the approval. So: if the owner's reply is itself the wording, send
          exactly that; if it is a bare approval, send the rest of that
          delivery, below the last `DRAFT:` line in it, unchanged — to the
          conversation id named directly above that same `DRAFT:` line. Both
          anchors are there because a delivery quotes the guest, and a guest
          who writes `DRAFT:` or an id puts a second candidate of either into
          it. Neither can be reached: whoever composed the delivery was told to
          name the id, then the marker, then the wording, and end there — so
          the real pair is the final one, and a quote sits above it. If more
          than
          one draft is waiting, ask which one. If you cannot find the draft or
          its conversation id, ask — never reconstruct either.
mcp_servers:
  hostex:
    url: https://hostex.io/mcp
    headers:
      Authorization: Bearer ${HOSTEX_TOKEN}
    enabled: true
    timeout: 120
    tools:
      include:
      - search_conversations
      - get_conversation
      - send_message
      - update_conversation_note
      # The only tool here that yields a property_id or listing_id, which six
      # of the seven calendar tools below require as an argument. Without it
      # the agent has to scrape an id out of a reservation to price a listing.
      - search_properties
      - search_listing_calendars
      - search_availabilities
      - update_availabilities
      - update_listing_prices
      - update_listing_inventories
      - update_listing_restrictions
      - get_pricing_ratios
      - search_reservations
      - search_reviews
      # What Hostex will send on its own. Its scheduled templates post under
      # `host` and carry whole check-in policies — 515 of 2,683 live host
      # messages — so a draft written without reading them answers a guest
      # twice, or contradicts wording nobody reviewed. bin/hostex-poll.py's
      # is_automated() is the same problem read backwards: that one recognises
      # a template that already fired, this one a template still queued.
      - search_automation_actions
      # The cleaning and maintenance schedule, which the agent otherwise knows
      # only from whatever the cleaners happened to say in their group thread.
      # search_staffs is deliberately absent: it returns each cleaner's mobile
      # and email into a runtime that also drafts guest-facing messages, and
      # #24 names those details as the thing that must never cross. Tasks carry
      # staff_name and no contact fields, so this is the schedule without them.
      - search_tasks
      # The one write added here, and it reaches no guest: it sets the lock code
      # shown in the check-in guide and Hostex explicitly does not notify anyone
      # about it. That keeps it outside the approval path rather than a way
      # around it, and it is what pairs a Seam-programmed code with the place
      # the guest actually reads one.
      - update_reservation_checkin_details
      resources: false
      prompts: false
  # Seam's official MCP server is documentation and device search only, so this
  # is the first-party stdio server in mcp-seam/, bind-mounted by compose and
  # launched with uv. Restoring without it produced an agent that could read
  # Hostex but not touch a door — see README § Seam (smart locks).
  seam:
    command: uv
    args:
    - run
    - --no-project
    - --with
    - seam==1.209.0
    - --with
    - fastmcp==3.4.5
    - python
    # Interpolated by Hermes' own config loader (agent/secret_scope, falling
    # back to os.environ) -- the same mechanism the SEAM_API_KEY entry below
    # already relies on, verified to recurse into `args` too. HERMES_HOME is
    # the image's own env var, /opt/data today and /var/lib/hermes once this
    # agent opts into agent-mgr's boot contract -- matching wherever compose
    # actually mounts mcp-seam either way, with no compose-level variable
    # reaching into this file.
    - ${HERMES_HOME}/mcp-seam/server.py
    env:
      SEAM_API_KEY: ${SEAM_API_KEY}
    enabled: true
    timeout: 120
    tools:
      include: [list_locks, get_lock, lock_door, unlock_door,
                get_action_attempt, list_action_attempts, list_lock_events,
                list_access_codes, get_access_code,
                create_access_code, update_access_code, delete_access_code,
                convert_access_code_to_managed]
      resources: false
      prompts: false
