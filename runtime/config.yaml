# The declarative half of ~/.hermes — everything that is a deliberate choice for
# this deployment. Keys equal to the image's own defaults are deliberately
# absent so the image supplies its own current defaults instead of a frozen
# snapshot; likewise _config_version. (The image is pinned by digest in the
# Dockerfile — "current" means whatever that pinned image ships, not `latest`.) Verified against the running image: with
# the key absent, hermes config get _config_version reports the current 33 and
# the file is left byte-identical — an unversioned config is read as current,
# not as an old schema needing migration.
#
# Deliberately inherited, not pinned: the image's local terminal and browser
# backends stay enabled. The agent is used for real operations work and needs
# them; because the container mounts ~/.hermes, that is also the deployment's
# widest blast radius. See the trust boundary in the README before adding a
# group chat.
# No model route here: plow-init owns it, rewriting model/providers from the
# base image's seed on every boot (Plow's proxy, per the operator's ruling), so
# a tracked copy could only drift from what actually boots.
agent:
  # Carried over from the original install rather than re-derived; kept so a
  # restore reproduces the behaviour the operator has been running with.
  verify_on_stop: false
cron:
  # The agent's final response is the whole message; the default header and
  # "stop reminder" footer doubled every guest alert's length.
  wrap_response: false
# One session per group chat, not one per member. A poller's wake (hostex-poll's
# guest drafts, turnover-poll's steps) is a turn in the group's session, and the
# reply it asks for comes from whichever member answers: with per-member
# sessions that reply lands in a session that never saw the question (#84).
#
# Gateway-level on purpose: this is the key the *persisted* session is written
# under, and the image reads it only from the top level of this file or a
# `gateway:` section — never from a platform's `extra`. The plow_chat plugin
# sets the same value in its adapter config; that one governs the in-memory
# dispatch guard, and the two have to agree. See the comment there.
#
# The cost is that the owners share conversation context in a group thread,
# which is what a group thread reads like anyway.
group_sessions_per_user: false
# On a full-budget timeout the aux client skips the same-provider retry for
# compression and falls back -- but by default there is nowhere to land, so an
# oversized session freezes and every turn re-stalls. A sibling agent lost ~30h
# to that on 2026-08-31 (plow-pbc/life-assistant-hermes-agent#71); the main
# route is Plow's proxy now, but the codex OAuth in auth.json is still valid and
# a second provider is exactly what a same-provider stall cannot take down.
#
# The model is pinned, not free-form: a ChatGPT-account codex serves only
# gpt-5.6-sol and gpt-5.5; every other id 400s. Verify a swap by the fallback
# log lines, never the return value -- the implicit main-model fallback reports
# success for a model the account actually rejected. gpt-5.5 was confirmed
# GENUINE against this agent's own auth before landing, and the pinned image
# (0.19.0) was confirmed to carry the fallback_chain machinery, so this is
# honoured rather than inert.
#
# No task-level `timeout` on purpose. The image floors a config-derived
# compression timeout at 300s so a slow reasoning summary is not cut off into
# the deterministic context marker (#54915) -- a lower value is silently raised,
# and setting one that DID bite would re-introduce that bug. A genuinely dead
# stream is caught at 60s by the no-progress timeout, not by this budget.
# The chain entry keeps its own 300s: without one it inherits the 30s auxiliary
# default, far too short for a summary.
auxiliary:
  compression:
    fallback_chain:
    - provider: openai-codex
      model: gpt-5.5
      timeout: 300

# Turnover tasks (bin/turnover-poll.py) are a ledger the thread sessions read
# with kanban_show and append to with kanban_comment, and kanban is off by
# default everywhere. This is the profile-wide opt-in, which adds the toolset to
# each platform's default list; an explicit platform_toolsets.plow_chat list
# would replace that default instead (probed on the pinned image: the
# `[hermes-plow_chat, kanban]` form drops terminal, file and twenty more), and
# `hermes tools enable --platform plow-chat` writes a key the gateway never
# reads (its sessions are plow_chat). hermes-cli is the image's own value,
# restated because the list is replaced whole.
toolsets:
- hermes-cli
- kanban
# The board is used as a ledger only, so nothing of kanban's own may act on it.
# The dispatcher is on by default and would hand a task to a detached worker the
# moment it had an assignee; a default assignee would give every unassigned
# task one. auto_subscribe_on_create defaults on, so a session that ever called
# kanban_create would subscribe its thread to board wakes. turnover-poll reads
# these three back through `hermes config get` and refuses to run otherwise.
kanban:
  dispatch_in_gateway: false
  default_assignee: ""
  auto_subscribe_on_create: false
# The base's skills for the old Latch relay route the owner's Mac through its
# plow_* tools, which are gone; the latch skill is the route (bin/latch-boot).
skills:
  disabled:
  - owners-mac
  - google-workspace
# The base seed sets this, but this file replaces the seed's config.yaml on
# every boot, so without it Hermes' default "ask" appends a build-a-profile
# directive to the owner's first message and it wins over str-setup's opener
# (seen live on a fresh install). The runtime's `seen` flags under this key are
# state and stay out of this file.
onboarding:
  profile_build: "off"
plugins:
  enabled:
  - plow-chat-platform
  entries:
    plow-chat-platform:
      allow_tool_override: false
platforms:
  plow_chat:
    enabled: true
mcp_servers:
  hostex:
    url: https://hostex.io/mcp
    headers:
      Authorization: Bearer ${HOSTEX_TOKEN}
    enabled: true
    timeout: 120
    tools:
      include:
      - search_conversations
      - get_conversation
      - send_message
      - update_conversation_note
      # The only tool here that yields a property_id or listing_id, which six
      # of the seven calendar tools below require as an argument. Without it
      # the agent has to scrape an id out of a reservation to price a listing.
      - search_properties
      - search_listing_calendars
      - search_availabilities
      - update_availabilities
      - update_listing_prices
      - update_listing_inventories
      - update_listing_restrictions
      - get_pricing_ratios
      - search_reservations
      - search_reviews
      # What Hostex will send on its own. Its scheduled templates post under
      # `host` and carry whole check-in policies — 515 of 2,683 live host
      # messages — so a draft written without reading them answers a guest
      # twice, or contradicts wording nobody reviewed. bin/hostex-poll.py's
      # is_automated() is the same problem read backwards: that one recognises
      # a template that already fired, this one a template still queued.
      - search_automation_actions
      # The cleaning and maintenance schedule, which the agent otherwise knows
      # only from whatever the cleaners happened to say in their group thread.
      # search_staffs is deliberately absent: it returns each cleaner's mobile
      # and email into a runtime that also drafts guest-facing messages, and
      # #24 names those details as the thing that must never cross. Tasks carry
      # staff_name and no contact fields, so this is the schedule without them.
      - search_tasks
      # The one write added here, and it reaches no guest: it sets the lock code
      # shown in the check-in guide and Hostex explicitly does not notify anyone
      # about it. That keeps it outside the approval path rather than a way
      # around it, and it is what pairs a Seam-programmed code with the place
      # the guest actually reads one.
      - update_reservation_checkin_details
      resources: false
      prompts: false
  # Seam's official MCP server is documentation and device search only, so this
  # is the first-party stdio server in mcp-seam/, bind-mounted by compose and
  # launched with uv. Restoring without it produced an agent that could read
  # Hostex but not touch a door — see README § Seam (smart locks).
  seam:
    command: uv
    args:
    - run
    - --no-project
    - --with
    - seam==1.209.0
    - --with
    - fastmcp==3.4.5
    - python
    # The image's own authoritative copy, not a path in the home. mcp-seam used
    # to arrive as a bind mount from the deploy clone at $HERMES_HOME/mcp-seam;
    # a published image has no deploy clone, and a home migrated from that shape
    # brings an empty directory where the mount used to be. Naming /opt/plow
    # directly is what makes the server reachable with no host involved -- and
    # it is root-owned there, so the agent cannot rewrite the server that holds
    # its lock credentials. 05-install-agent-payload.sh still links
    # $HERMES_HOME/mcp-seam at it, so a home carrying the old spelling keeps
    # working across the cutover.
    - /opt/plow/str/mcp-seam/server.py
    env:
      SEAM_API_KEY: ${SEAM_API_KEY}
    enabled: true
    timeout: 120
    tools:
      include: [list_locks, get_lock, lock_door, unlock_door,
                get_action_attempt, list_action_attempts, list_lock_events,
                list_access_codes, get_access_code,
                create_access_code, update_access_code, delete_access_code,
                convert_access_code_to_managed]
      resources: false
      prompts: false
